[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelwiki"
version = "0.1.0"
description = "Operator-centered GPU kernel knowledge and GEAK-compatible patch access"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kernel_patch", "kernel_patch._store"]

[tool.pytest.ini_options]
testpaths = ["tests", "kernel_patch/_store/tests"]
