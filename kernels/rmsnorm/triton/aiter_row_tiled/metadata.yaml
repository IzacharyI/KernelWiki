schema_version: 1
implementation_id: rmsnorm/triton/aiter_row_tiled
operator: rmsnorm
backend: triton
name: aiter_row_tiled
description: AITER row-tiled forward RMSNorm for large M and small N.
status: reference
license: MIT
entry_point:
  file: entry.py
  symbol: rmsnorm
dependencies:
  - torch>=2.6 with ROCm support
  - triton>=3.2 matching the PyTorch ROCm build
files:
  source: [kernel.py, kernel_repr.py, entry.py]
  tests: [test.py, reference.py]
  benchmarks: [benchmark.py]
  config: [launch.json, requirements.txt]
  support: [README.md, LICENSE]
commands:
  test: [python, test.py]
  benchmark: [python, benchmark.py, --baseline, torch]
supports:
  gfx: [gfx942, gfx950]
  dtypes: [bf16, fp16]
  shape:
    M: {min: 8193}
    N: {min: 1, max: 2048}
  layout: Contiguous x[M,N] and weight[N], same device and dtype.
  semantics: Forward inference only; positive finite epsilon; no mutation of inputs.
validation:
  status: not_run
  reason: No ROCm GPU or PyTorch/Triton runtime was available on the packaging host.
provenance:
  provider: aiter
  repository: https://github.com/ROCm/aiter
  commit: e9995854abbd935f0190b19abebe9938b6b90cca
  source_path: aiter/ops/triton/_triton_kernels/normalization/rmsnorm.py
  symbol: _rmsnorm_kernel_large_m_small_n
  adaptations:
    - Extracted the kernel body and naming helper without changing their computation.
    - Added a standalone forward wrapper with explicit applicability checks.
    - Copied gfx942/gfx950 launch settings into launch.json.
    - Added standalone correctness and benchmark programs.
benchmarks:
  - kind: upstream_reported
    evidence:
      - https://github.com/ROCm/aiter/blob/e9995854abbd935f0190b19abebe9938b6b90cca/aiter/ops/triton/normalization/rmsnorm.py#L238
    gpu_model: MI308X
    dtype: bf16
    shape: {M: 16384, N: 128}
    reported_forward_speedup: 13.6
    limitations: Source comment only; raw timings and a complete timing protocol are unavailable. The extracted wrapper has not been remeasured.
